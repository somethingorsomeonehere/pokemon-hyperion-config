syntax = "proto3";

package er;

import "MoveBehavior.proto";
import "MoveEffect.proto";
import "Types.proto";

option java_package = "er.proto";
option java_multiple_files = true;

message MoveBehaviorConfigList {
  repeated MoveBehaviorConfig config = 1;
}

message MoveBehaviorConfig {

  message Attack {
    message AttackMoveEffect {
      MoveEffect effect = 1;
      bool affects_user = 2;
      bool certain = 3;
    }

    message AttackSecondaryEffect {
      int32 chance = 1;
      oneof attack_effect {
        AttackMoveEffect move_effect = 3;
      }
    }

    repeated AttackSecondaryEffect effect = 1;
    oneof resistance_modifier {
      Type super_effective_vs = 2;
      bool ignore_type_immunity = 3;
    }
    int32 recoil_fraction = 4;
  }

  MoveBehavior id = 1;
  oneof config_type {
    string legacy_config = 2;
    Attack attack = 3;
  }
}
